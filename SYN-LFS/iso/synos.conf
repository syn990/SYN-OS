# =============================================================================
#                          SYN-OS (LFS) synos.conf
#   Everything synos-install needs, in one file.
#   Edit it, then run synos-install. It's read once at the start; nothing
#   is asked interactively except the final "wipe this disk?" check.
#
#   The LFS build installs one way: UEFI, a FAT32 EFI system partition and
#   an ext4 root, kernel booted straight by the firmware. No bootloader, no
#   initramfs, so no LUKS or LVM root (yet).
# =============================================================================

# --- Who and where ------------------------------------------------------------
Hostname="synbox"
UserAccountName="syntax990"
UserAccountPassword="CHANGE_ME"   # removed from the installed copy of this file
UserShell="/bin/zsh"

# --- Language, keyboard, clock ------------------------------------------------
Locale="en_GB.UTF-8"              # generated on the new system if it isn't already
KeyMap="uk"                       # console keymap; labwc gets the matching XKB layout
VconsoleFont="ter-v16n"
TimeZone="GB"                     # anything under /usr/share/zoneinfo

# --- Disk ---------------------------------------------------------------------
# The WHOLE disk to install to, e.g. /dev/nvme0n1 or /dev/sda. `lsblk` lists
# them. Everything on it is erased.
Disk="CHANGE_ME"
BootSize="512MiB"                 # EFI system partition; the root gets the rest
RequireWipeConfirm="yes"          # yes: ask before wiping (leave it on)
