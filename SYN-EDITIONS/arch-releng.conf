# ============================================================================================
#  SYN-OS Build Configuration: Arch Linux's own installation ISO (releng)
#  (Declarative Build State with Strategy Selectors)
#
#  Not SYN-OS: Arch's releng profile exactly as archiso ships it, built
#  through the same glue, to show an edition needn't be SYN-OS's own.
#  `zsh BUILD.zsh list` shows them all.
#
#  2026-10-08: on squashfs-tools 4.7.5 with xz 5.8.4, mksquashfs crashes
#  on releng's root ("xz uncompress failed with error code 9", at the same
#  file every time) with the profile's -Xbcj x86,arm64. The same root
#  squashes with -Xbcj x86 alone; the profile is left as Arch ships it.
# ============================================================================================

# ----- Edition -----
Edition="Arch releng"
Summary="Arch Linux's own installation ISO (archiso's releng profile), no SYN layer"

# ----- STRATEGY SELECTORS -----
# BaseStrat: how the root filesystem comes to be.
#   arch  Arch Linux, put together by mkarchiso from an archiso profile
BaseStrat="arch"

# PackageStrat: how the system's packages arrive.
#   pacman  Arch's repositories (the profile's packages.x86_64)
PackageStrat="pacman"

# KernelStrat: which kernel.
#   arch  Arch's linux package
KernelStrat="arch"

# LayerStrat: what goes on top of the profile.
#   syn   the SYN layer: SYN-SOFTWARE's tools built into the profile
#   none  nothing: the profile as it is, built by mkarchiso alone
LayerStrat="none"

# OutputStrat: what comes out.
#   iso   a bootable ISO
OutputStrat="iso"

# ----- Arch -----
# The archiso profile: relative to the repository, or an absolute path.
# It's copied before building, so the original is never written to
Profile="/usr/share/archiso/configs/releng"
