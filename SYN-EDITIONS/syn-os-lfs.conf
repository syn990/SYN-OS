# ============================================================================================
#  SYN-OS Build Configuration: SYN-OS on LFS
#  (Declarative Build State with Strategy Selectors)
#
#  One edition, one file: what to build and how, checked by BUILD.zsh before
#  anything runs. Copy it to make another edition; `zsh BUILD.zsh list` shows
#  them all.
# ============================================================================================

# ----- Edition -----
Edition="SYN-OS"
Summary="SYN-OS on Linux From Scratch: our base and kernel, runit, Void's packages for the desktop"

# ----- STRATEGY SELECTORS -----
# BaseStrat: how the root filesystem comes to be.
#   arch  Arch Linux, put together by mkarchiso from SYN-ISO-PROFILE (systemd)
#   lfs   Linux From Scratch, built by jhalfs, with runit (see SYN-LFS)
BaseStrat="lfs"

# PackageStrat: how the system's packages arrive.
#   pacman  Arch's repositories (arch only)
#   source  every desktop package compiled from SYN-LFS/desktop/order, with
#           the big applications from Void (SYN-LFS/xbps/packages.txt)
#   xbps    the desktop from Void's binary packages (SYN-LFS/xbps/desktop.txt)
PackageStrat="xbps"

# KernelStrat: which kernel.
#   arch  Arch's linux package (arch only)
#   syn   built from SYN-LFS/kernel.syn
KernelStrat="syn"

# OutputStrat: what comes out.
#   iso   a bootable ISO with the live session and the installer
OutputStrat="iso"

# ----- LFS -----
# Where the disk image, sources and logs live (one work directory per
# PackageStrat), and how much of the desktop to install (full, or minimal:
# no appsMedia)
WorkDir="$HOME/SYN-OS-build-xbps"
LfsProfile="full"
